    <meta name="description" content="整理 Claude 在长文档阅读、写作和资料归纳中的使用场景。" />

  <body>
    <main class="plain-page">
      <header>
        <p class="eyebrow">Tool</p>
        <h1>Claude 使用场景整理</h1>
      </header>
      <section>
        <h2>适合做什么</h2>
        <p>
          Claude 常被用于长文档阅读、稳健写作、资料归纳、语气控制和复杂问题拆解。对于合同草稿、研究材料、访谈记录、产品文档和长篇文章，它可以帮助用户快速提取结构、观点和待确认问题。
        </p>
      </section>
      <section>
        <h2>推荐用法</h2>
        <p>
          当你处理长文本时，可以先让 Claude 输出摘要、争议点、行动项和不确定信息，再要求它按你的目标重组内容。不要一次性要求它完成所有步骤，分阶段处理通常更容易发现遗漏和误解。
        </p>
      </section>
      <section>
        <h2>注意事项</h2>
        <p>
          长文档总结并不等于法律或专业审查。对于合同、财务、医疗和合规材料，AI 结果只能作为阅读辅助，最终结论仍应由专业人士确认。
        </p>
      </section>
